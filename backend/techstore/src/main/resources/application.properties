spring.application.name=techstore
server.port=8080
server.forward-headers-strategy=framework

# Base de datos (local)
spring.datasource.url=jdbc:postgresql://localhost:5432/techstore
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:cambiar}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:cambiar-este-secret-por-uno-largo-y-seguro-123456}
app.jwt.expiration-ms=3600000
app.jwt.preauth-expiration-ms=300000

# Frontend
app.frontend-url=http://localhost:5173

# Login social (se configuran con variables de entorno)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:no-configurado}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:no-configurado}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:no-configurado}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:no-configurado}
spring.security.oauth2.client.registration.github.scope=read:user,user:email